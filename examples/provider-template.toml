# Copy this file, replace example values, and pass it with --config.
# No secret value belongs in this file.
schema_version = 3

[router]
active_alias = "free-1m"

[providers.bai]
name = "B.AI"
kind = "bai"
protocol = "openai_chat_completions"
base_url = "https://api.b.ai/v1"
enabled = true

[credentials.bai-main]
provider = "bai"
source = "env:BAI_API_KEY"
auth_scheme = "x-api-key"

[models.bai."deepseek-1m"]
wire_model = "deepseek-1m"
context_window = 1000000
max_output_tokens = 128000
verified_context = true
free = true

[providers.opencode-free]
name = "OpenCode Free"
kind = "opencode"
protocol = "openai_chat_completions"
base_url = "https://opencode.ai/zen/v1"
enabled = true

[models.opencode-free."deepseek-v4-flash-free"]
wire_model = "deepseek-v4-flash-free"
context_window = 1000000
max_output_tokens = 384000
verified_context = true
free = true

[aliases.free-1m]
client_model = "sonnet[1m]"
context_window = 1000000
strict_context = true

[[aliases.free-1m.candidates]]
provider = "bai"
model = "deepseek-1m"
credential = "bai-main"
priority = 0

[[aliases.free-1m.candidates]]
provider = "opencode-free"
model = "deepseek-v4-flash-free"
priority = 10

[package]
name = "opencode2api"
version = "0.5.0"
edition = "2021"
autobins = false
description = "Use Claude Code with any LLM (DeepSeek, GPT-4o, Gemini, Llama, etc.) — for free"
license = "MIT"
homepage = "https://github.com/nmhuei/opencode2api"
repository = "https://github.com/nmhuei/opencode2api"
readme = "README.md"
keywords = ["claude", "opencode", "llm", "proxy", "cli"]
categories = ["command-line-utilities", "web-programming", "development-tools"]

[dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-stream = { version = "0.1", features = ["net"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "socks", "rustls-tls"] }
tower = { version = "0.4", features = ["limit", "buffer", "util"] }
tower-http = { version = "0.5", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["full"] }
thiserror = "2"
anyhow = "1.0"
toml = "0.8"
clap = { version = "4.4", features = ["derive", "wrap_help", "string"] }
clap_complete = "4.5"
yansi = "1.0"
unicode-width = "0.2"
comfy-table = "7.1"
indicatif = "0.18"
rust-embed = { version = "8", features = ["mime-guess", "interpolate-folder-path"] }
mime_guess = "2"
async-stream = "0.3"
async-trait = "0.1"
dotenvy = "0.15"
getrandom = "0.2"
sha2 = "0.11"
httpdate = "1.0"
bytes = "1.10"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "socks", "rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "opencode2api"
path = "src/bin/opencode2api.rs"

[[bin]]
name = "opencode2api-serve"
path = "src/serve_main.rs"

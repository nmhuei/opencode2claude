name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier-a:
    name: Tier A (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run deterministic Tier A
        run: |
          chmod +x scripts/*.sh tests/*.sh
          scripts/tier-a.sh

      - name: Upload Tier A evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tier-a-linux-${{ github.sha }}
          path: |
            verification/completion/
            target/debug/opencode2api
          if-no-files-found: warn
          retention-days: 14

  tier-b:
    name: Tier B (Linux)
    needs: tier-a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Install supply-chain tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Run protected Tier B
        env:
          SKIP_TIER_A: '1'
        run: |
          chmod +x scripts/*.sh tests/*.sh
          scripts/tier-b.sh

      - name: Version-check release binary
        run: python3 scripts/check_version_consistency.py --binary target/release/opencode2api

      - name: Upload release smoke binary
        uses: actions/upload-artifact@v5
        with:
          name: tier-b-linux-${{ github.sha }}
          path: target/release/opencode2api
          retention-days: 14

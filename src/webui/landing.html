<!DOCTYPE html>
<html lang="en" data-theme="mecha">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080B1A">
  <title>OpenCode2API Bridge</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/dashboard/assets/mecha/branding/favicon-32.png">
  <link rel="stylesheet" href="/dashboard/style.css">
  <link rel="stylesheet" href="/dashboard/mecha.css">
  <link rel="stylesheet" href="/dashboard/control-deck-v2.css">
  <script src="/dashboard/mecha-components.js" defer></script>
  <script src="/dashboard/control-deck-v2.js" defer></script>
</head>
<body class="login-page">
  <button class="button ghost theme-toggle login-theme-toggle" data-theme-toggle type="button" aria-pressed="true"><span data-theme-label>MECHA</span></button>
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="loginTitle">
      <div class="login-brand"><img class="brand-symbol pixel-art" src="/dashboard/assets/mecha/branding/logo-icon.png" alt="OpenCode2API"></div>
      <div class="login-copy">
        <p class="eyebrow">Local control plane</p>
        <h1 id="loginTitle">OpenCode2API</h1>
        <p>Manage models, routing, access, diagnostics and the local bridge from one quiet workspace.</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <label for="password">Admin token</label>
        <div class="input-action">
          <div class="password-input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter dashboard token" required autofocus>
            <button id="togglePassword" class="password-toggle" type="button" aria-label="Show admin token" aria-controls="password" aria-pressed="false" title="Show admin token">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path id="passwordTogglePath" d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6ZM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>
            </button>
          </div>
          <button id="submitBtn" class="button primary" type="submit">Continue</button>
        </div>
        <p id="errorMsg" class="form-message error" role="alert" hidden></p>
      </form>

      <footer class="login-footer">
        <span class="status-dot neutral"></span>
        <span>Bound to your local bridge</span>
      </footer>
    </section>
  </main>

  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var input = document.getElementById('password');
      var toggle = document.getElementById('togglePassword');
      var togglePath = document.getElementById('passwordTogglePath');
      var button = document.getElementById('submitBtn');
      var error = document.getElementById('errorMsg');

      toggle.addEventListener('click', function () {
        var reveal = input.type === 'password';
        input.type = reveal ? 'text' : 'password';
        toggle.setAttribute('aria-pressed', String(reveal));
        toggle.setAttribute('aria-label', reveal ? 'Hide admin token' : 'Show admin token');
        toggle.title = reveal ? 'Hide admin token' : 'Show admin token';
        togglePath.setAttribute('d', reveal
          ? 'M3 3l18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16.8 16.8 0 0 1-2.1 2.7M6.3 6.3C3.8 8.1 2.5 12 2.5 12s3.5 6 9.5 6a10 10 0 0 0 4.1-.9M9.9 9.9a3 3 0 0 0 4.2 4.2'
          : 'M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6ZM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z');
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      });

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        var token = input.value.trim();
        if (!token) return;
        button.disabled = true;
        button.textContent = 'Checking…';
        error.hidden = true;
        try {
          var response = await fetch('/api/dashboard/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ token: token })
          });
          var data = await response.json().catch(function () { return {}; });
          if (!response.ok) throw new Error(data.message || 'Authentication failed');
          location.replace('/dashboard/');
        } catch (reason) {
          error.textContent = reason.message || 'Authentication failed';
          error.hidden = false;
          input.select();
        } finally {
          button.disabled = false;
          button.textContent = 'Continue';
        }
      });
    }());
  </script>
</body>
</html>

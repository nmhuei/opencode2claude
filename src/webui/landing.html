<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenCode2API Bridge</title>
<meta name="description" content="OpenCode2API Translation Bridge Portal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-body: #09090b;
    --bg-card: #101014;
    --border: #27272a;
    --text-primary: #fafafa;
    --text-secondary: #a1a1aa;
    --accent-indigo: #6366f1;
    --accent-green: #10b981;
    --radius-lg: 12px;
    --radius-md: 8px;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    background-color: var(--bg-body);
    color: var(--text-primary);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    padding: 20px;
  }

  /* Subtle background radial glows matching dashboard */
  .bg-glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: 
      radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.04) 0%, transparent 60%);
    pointer-events: none;
  }
  
  /* Floating card container */
  .portal-card {
    position: relative;
    z-index: 10;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    width: 380px;
    max-width: 100%;
    padding: 32px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
    gap: 24px;
    animation: portalFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes portalFadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  /* Header styling */
  .portal-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
  }
  
  .portal-logo {
    width: 48px;
    height: 48px;
    background: rgba(99, 102, 241, 0.1);
    color: var(--accent-indigo);
    border: 1px solid rgba(99, 102, 241, 0.15);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
  }
  
  .portal-logo svg {
    width: 24px;
    height: 24px;
  }
  
  .portal-title {
    font-family: 'Outfit', var(--font-sans);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #ffffff;
  }

  .portal-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent-green);
    background: rgba(16, 185, 129, 0.06);
    border: 1px solid rgba(16, 185, 129, 0.15);
    padding: 3px 8px;
    border-radius: 20px;
    margin-top: 2px;
  }

  .portal-status .dot {
    width: 6px;
    height: 6px;
    background-color: var(--accent-green);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-green);
  }
  
  .portal-desc {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-secondary);
    text-align: center;
  }
  
  /* Buttons */
  .portal-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 20px;
    font-size: 13px;
    font-weight: 500;
    border-radius: var(--radius-md);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
    width: 100%;
  }
  
  .btn-primary {
    background: var(--accent-indigo);
    color: #ffffff;
    border: 1px solid var(--accent-indigo);
  }
  
  .btn-primary:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }

  .btn-primary:active {
    transform: translateY(0);
  }
  
  .btn-secondary {
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  
  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-primary);
    border-color: #3f3f46;
  }

  .portal-footer {
    text-align: center;
    font-size: 10px;
    color: var(--text-secondary);
    opacity: 0.5;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="portal-card">
  <div class="portal-header">
    <div class="portal-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"/>
        <polyline points="2 17 12 22 22 17"/>
        <polyline points="2 12 12 17 22 12"/>
      </svg>
    </div>
    <h1 class="portal-title">OpenCode2API</h1>
    <div class="portal-status">
      <span class="dot"></span>
      <span>Bridge Active</span>
    </div>
  </div>
  
  <p class="portal-desc">
    Local API compatibility proxy translation bridge active on port 4000.
  </p>
  
  <form id="loginForm" onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
    <div style="display: flex; flex-direction: column; gap: 6px; width: 100%;">
      <input type="password" id="password" placeholder="Enter admin password..." required style="width: 100%; padding: 11px 16px; border-radius: var(--radius-md); border: 1px solid var(--border); background: rgba(255,255,255,0.02); color: var(--text-primary); font-family: var(--font-sans); font-size: 13px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='var(--accent-indigo)'" onblur="this.style.borderColor='var(--border)'">
      <div id="errorMsg" style="color: #ef4444; font-size: 12px; margin-top: 4px; display: none;"></div>
    </div>
    <button type="submit" id="submitBtn" class="btn btn-primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10 17 15 12 10 7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
      <span>Sign In to Dashboard</span>
    </button>
  </form>
  
  <div class="portal-actions" style="margin-top: -12px;">
    <a href="/health" target="_blank" class="btn btn-secondary">
      <span>Verify Health</span>
    </a>
  </div>

  <div class="portal-footer">
    API Bridge Portal
  </div>
</div>

<script>
  function getCookie(name) {
    var value = "; " + document.cookie;
    var parts = value.split("; " + name + "=");
    if (parts.length === 2) return parts.pop().split(";").shift();
  }

  function setCookie(name, value, days) {
    var expires = "";
    if (days) {
      var date = new Date();
      date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
      expires = "; expires=" + date.toUTCString();
    }
    document.cookie = name + "=" + (value || "")  + expires + "; path=/; SameSite=Strict";
  }

  // If already logged in, redirect to dashboard automatically
  var currentToken = getCookie('bridge_admin_token');
  if (currentToken) {
    fetch('/api/dashboard/login', {
      method: 'POST',
      headers: {
        'X-Dashboard-Token': currentToken,
        'Accept': 'application/json'
      }
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) {
        window.location.href = '/dashboard/';
      }
    })
    .catch(function() {});
  }

  async function handleLogin(e) {
    e.preventDefault();
    var passwordInput = document.getElementById('password');
    var errorMsg = document.getElementById('errorMsg');
    var submitBtn = document.getElementById('submitBtn');
    var password = passwordInput.value.trim();
    
    if (!password) return;
    
    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    var btnText = submitBtn.querySelector('span');
    var originalText = btnText.textContent;
    btnText.textContent = 'Verifying...';

    try {
      var resp = await fetch('/api/dashboard/login', {
        method: 'POST',
        headers: {
          'X-Dashboard-Token': password,
          'Accept': 'application/json'
        }
      });
      
      var data = await resp.json();
      if (data.success) {
        setCookie('bridge_admin_token', password, 365);
        window.location.href = '/dashboard/';
      } else {
        errorMsg.textContent = data.message || 'Invalid password';
        errorMsg.style.display = 'block';
      }
    } catch (err) {
      errorMsg.textContent = 'Connection error: ' + err.message;
      errorMsg.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      btnText.textContent = originalText;
    }
  }
</script>

</body>
</html>
